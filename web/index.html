<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EntDoc Bulk Upload</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img src="logo.svg" alt="" width="36" height="36">
    <div>
      <h1>EntDoc Bulk Upload</h1>
      <p class="tagline">Upload many PDFs at once. We repair, resize to A4, compress and strip metadata.</p>
    </div>
    <span id="mode-badge" class="badge" hidden>Demo mode</span>
  </header>

  <main>
    <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Choose PDF files or drop them here">
      <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p><strong>Drag &amp; drop PDFs here</strong> or <u>browse</u></p>
      <p class="hint" id="limits-hint">PDF only</p>
      <input id="file-input" type="file" accept="application/pdf,.pdf" multiple hidden>
    </section>

    <div id="alert" class="alert" role="alert" hidden></div>

    <section class="panel" id="queue-panel" hidden>
      <div class="panel-head">
        <h2>Files <span id="count" class="muted"></span></h2>
        <div class="actions">
          <button id="start-btn" class="primary">Upload all</button>
          <button id="clear-btn" class="ghost">Clear finished</button>
        </div>
      </div>
      <ul id="file-list" class="file-list"></ul>
    </section>

    <section class="panel" id="results-panel" hidden>
      <div class="panel-head"><h2>Results</h2><span id="summary" class="muted"></span></div>
      <table class="results">
        <thead><tr><th>File</th><th>Status</th><th>Pages</th><th>Size</th><th></th></tr></thead>
        <tbody id="results-body"></tbody>
      </table>
    </section>
  </main>

  <footer>EntDoc Bulk Upload &middot; files are stored privately and expire automatically.</footer>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
