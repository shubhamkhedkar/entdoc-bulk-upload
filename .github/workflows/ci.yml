# NOTE: GitHub Actions is DISABLED on this repository (Settings -> Actions -> Disable).
# This workflow only runs tests and static validation - it never deploys or calls AWS.
# Re-enable Actions to use it: gh api -X PUT repos/<owner>/entdoc-bulk-upload/actions/permissions -F enabled=true
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false -input=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform
